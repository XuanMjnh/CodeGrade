name: codegrade-network
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codegrade
      MYSQL_USER: codegrade
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_bin"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  server:
    build: {context: ., target: server}
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/codegrade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: codegrade
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN}
      DEMO_DATA: ${DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3' | grep -q '\"UP\"'"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped
  worker:
    build: {context: ., target: worker}
    environment:
      WORKER_URL: ws://server:8080/worker-ws
      WORKER_TOKEN: ${WORKER_TOKEN}
      SANDBOX_IMAGE: codegrade-sandbox:5
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    depends_on:
      server: {condition: service_healthy}
      sandbox: {condition: service_completed_successfully}
    restart: unless-stopped
  sandbox:
    image: codegrade-sandbox:5
    build: {context: ., dockerfile: worker/Dockerfile}
    command: ["true"]
volumes:
  mysql_data:
