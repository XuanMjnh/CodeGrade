server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/codegrade?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:codegrade}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  flyway:
    enabled: true
app:
  origins: ${APP_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
  admin-password: ${ADMIN_PASSWORD:}
  worker-token: ${WORKER_TOKEN:}
  demo: ${DEMO_DATA:false}
  max-queue: ${MAX_QUEUE:500}
logging:
  level:
    vn.codegrade: INFO
